<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240" role="img" aria-labelledby="title desc">
  <title id="title">AI-flowets lokale kladde gennem forløbet</title>
  <desc id="desc">Sammenligner samme localStorage-kladdestruktur ved intro, midt i flowet og efter færdiggørelse. Felterne består; deres værdier ændres.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Arial, sans-serif; fill: #334155; }
      .head { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .code { font: 12px Consolas, "Courier New", monospace; fill: #263445; }
      .label { font: 700 12px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .card { stroke-width: 1.5; rx: 0; }
    </style>
  </defs>
  <rect width="1680" height="1240" fill="#f8fafc"/>
  <rect width="1680" height="130" fill="#e6f4f1"/>
  <text x="48" y="55" class="title">Den lokale kladde ændrer værdier — ikke struktur</text>
  <text x="48" y="89" class="subtitle">Samme localStorage-objekt gemmes igen undervejs. Her er tre snapshots af de felter, kladden indeholder.</text>

  <text x="48" y="166" class="section">AI-FLOWENS LOCALSTORAGE-KLADDE · ÉT ARRAY-OBJEKT VIST</text>

