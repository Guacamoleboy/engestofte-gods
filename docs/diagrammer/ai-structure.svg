  <rect x="48" y="1060" width="1584" height="76" rx="12" fill="#e2e8f0"/>
  <text x="72" y="1090" class="small">Dette er browserens localStorage-kladde — ikke OpenAI's svarobjekt. OpenAI's acknowledgement vises inde i messages; den er AI-genereret.</text>
  <text x="72" y="1116" class="small">Dato udtrækkes af backend fra chatten; gæsteantal udtrækkes af frontend med AI-resultat som reserve. Allergi, veganertal og retning gemmes i frontend-kladden.</text>
  <text x="48" y="1174" class="small">Når login starter indsendelsen, tilføjes submissionId til den samme kladde.</text>

</svg>
