<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1030" viewBox="0 0 1680 1030" role="img" aria-labelledby="title desc">
  <title id="title">AI-flow</title>
  <desc id="desc">Enkelt flow fra kontakt og AI-flow gennem spørgsmål, svar og OpenAI-kald. Hvert svar udløser prompts med rubric. En færdig indsendelse udløser også en separat vurdering.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 17px Arial, sans-serif; fill: #334155; }
      .head { font: 700 17px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .body { font: 14px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .box { stroke-width: 1.7; rx: 10; }
      .arrow { stroke: #64748b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .choice { font: 700 13px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1680" height="1030" fill="#f8fafc"/>
  <rect width="1680" height="100" fill="#e6f4f1"/>
  <text x="48" y="62" class="title">AI-flow</text>

  <rect x="60" y="160" width="170" height="82" class="box" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="145" y="209" class="head">Kontakt</text>
  <path d="M230 201 H280" class="arrow"/>

  <rect x="280" y="160" width="190" height="82" class="box" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="375" y="209" class="head">AI-flow</text>
  <path d="M470 201 H518" class="arrow"/>

  <polygon points="625,145 735,201 625,257 515,201" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.7"/>
  <text x="625" y="196" class="head">Har kunden</text>
  <text x="625" y="218" class="head">data?</text>
  <text x="758" y="190" class="choice">Ja</text>
  <path d="M735 201 H800" class="arrow"/>

  <rect x="800" y="160" width="180" height="82" class="box" fill="#dcfce7" stroke="#86efac"/>
  <text x="890" y="209" class="head">Step 6</text>

  <text x="535" y="296" class="choice">Nej</text>
  <path d="M625 257 V350 H135 V410" class="arrow"/>

  <text x="48" y="390" class="section">AI-flow som normalt</text>
  <rect x="60" y="410" width="170" height="94" class="box" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="145" y="448" class="head">Introspørgsmål</text>
  <text x="145" y="476" class="small">første spørgsmål er fast</text>
  <path d="M230 457 H265" class="arrow"/>

  <rect x="265" y="410" width="130" height="94" class="box" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="330" y="465" class="head">Svar</text>
  <path d="M395 457 H430" class="arrow"/>

  <rect x="430" y="410" width="140" height="94" class="box" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="500" y="465" class="head">Backend</text>
  <path d="M570 457 H605" class="arrow"/>

  <rect x="605" y="395" width="220" height="124" class="box" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="715" y="431" class="head">Prompts</text>
  <text x="715" y="461" class="body">Systemprompt</text>
  <text x="715" y="488" class="body">Userprompt + rubric</text>
  <path d="M825 457 H860" class="arrow"/>

  <rect x="860" y="410" width="140" height="94" class="box" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="930" y="465" class="head">OpenAI</text>
  <path d="M1000 457 H1035" class="arrow"/>

  <rect x="1035" y="410" width="140" height="94" class="box" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="1105" y="465" class="head">Backend</text>
  <path d="M1175 457 H1210" class="arrow"/>

  <rect x="1210" y="410" width="140" height="94" class="box" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1280" y="465" class="head">Frontend</text>
  <path d="M1350 457 H1385" class="arrow"/>

  <rect x="1385" y="410" width="210" height="94" class="box" fill="#dcfce7" stroke="#86efac"/>
  <text x="1490" y="465" class="head">AI-flow</text>

  <path d="M1490 504 V590 H330 V504" class="arrow"/>

  <text x="48" y="665" class="section">Færdig forespørgsel indsendes</text>
  <rect x="60" y="700" width="260" height="100" class="box" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="190" y="743" class="head">Indsendelse</text>
  <text x="190" y="772" class="small">ved login / registrering</text>
  <path d="M320 750 H380" class="arrow"/>

  <rect x="380" y="700" width="320" height="100" class="box" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="540" y="741" class="head">Vurderingsprompts</text>
  <text x="540" y="773" class="body">Systemprompt + userprompt + rubric</text>
  <path d="M700 750 H760" class="arrow"/>

  <rect x="760" y="700" width="180" height="100" class="box" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="850" y="757" class="head">OpenAI</text>
  <path d="M940 750 H1000" class="arrow"/>

  <rect x="1000" y="700" width="300" height="100" class="box" fill="#dcfce7" stroke="#86efac"/>
  <text x="1150" y="741" class="head">Vurdering til ejer</text>
  <text x="1150" y="773" class="small">gemmes på forespørgslen</text>

  <path d="M890 242 V330 H1640 V850 H190 V800" class="arrow"/>
</svg>
