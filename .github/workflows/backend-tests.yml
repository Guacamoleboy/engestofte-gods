name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
          URL_PATHING: http://localhost
          SERVER_PORT: '7070'
          API_BASE_PATH: /v1
          ROUTE_ENDPOINT_FOLDER: /route
          APP_VERSION: 1.0.0
          APP_ENV: test
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          ACCESS_EXPIRATION: '600000'
          REFRESH_EXPIRATION: '604800000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run backend tests
        run: mvn --batch-mode --no-transfer-progress test